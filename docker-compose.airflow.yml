version: "3.8"

# EmberRisk Phase 9 -- local Airflow via Docker Compose.
#
# Uses LocalExecutor (not CeleryExecutor): this project targets an
# 8GB RAM / dual-core machine, and CeleryExecutor's extra worker +
# broker (Redis/RabbitMQ) processes are unnecessary overhead for a
# single-machine, low-volume DAG like this one. LocalExecutor still
# gives real parallel task execution within one machine, which is
# enough here -- see docs/phase9-orchestration.md for the full
# reasoning.
#
# This mounts the EmberRisk project directory into the Airflow
# containers so DAG tasks can import ingestion/, processing/, and ml/
# directly, exactly as they run outside Docker.

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4-python3.12
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    PYTHONPATH: /opt/airflow/project
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - .:/opt/airflow/project
  depends_on:
    - postgres

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --no-cache-dir -r /opt/airflow/project/requirements.txt
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname EmberRisk \
          --lastname Admin \
          --role Admin \
          --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init

volumes:
  postgres-db-volume:
