name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # tests/test_api.py and tests/test_static_ui.py use FastAPI's
      # TestClient, which triggers api/main.py's lifespan handler on
      # startup -- that handler calls ml.predict.load_locked_model(),
      # which requires a trained model artifact (models/gradient_boosting_
      # locked.joblib). That artifact is built from the full local raw
      # dataset (data/raw/), which is gitignored (60MB+, regenerated via
      # ingestion, not committed -- see Phase 8/9 decisions) and does not
      # exist on a fresh CI runner. Every other test file in this project
      # uses small, explicit in-memory fixtures (see e.g. test_ml_dataset.py
      # calling assemble_feature_label_table(cell_day, target) directly)
      # and needs no real data at all, so only these two API/UI test files
      # are skipped here -- the other 187 tests run for real.
      - name: Run test suite (excludes tests requiring the local dataset/trained model)
        run: PYTHONPATH=. pytest -q --ignore=tests/test_api.py --ignore=tests/test_static_ui.py
